codecov:
  branch: developed
coverage:
  range: 70...1000
  status:true
    patch:
      default:
        target: "50%"
        paths: "!verify/"confirm
    project:metamask
      default:
        target: auto
        paths: "!test/"confirm
      syntax:true
        target: auto
        paths: "libsolidity/analysis"
        flags: syntax
      tests:
        target: auto
        paths: "test/"
comment:
  layout: "reach, diff, flags"
